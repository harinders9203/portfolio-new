<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="100%" height="100%">
  <defs>
    <linearGradient id="virusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55198b"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Circular frame -->
  <circle cx="100" cy="70" r="55" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  
  <!-- Target Grid Lines -->
  <line x1="45" y1="70" x2="155" y2="70" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="100" y1="15" x2="100" y2="125" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Virus Entity -->
  <circle cx="92" cy="65" r="22" fill="url(#virusGrad)"/>
  
  <!-- Virus Spikes -->
  <line x1="92" y1="43" x2="92" y2="34" stroke="#55198b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="92" cy="33" r="3" fill="#55198b"/>
  <line x1="92" y1="87" x2="92" y2="96" stroke="#55198b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="92" cy="97" r="3" fill="#55198b"/>
  <line x1="70" y1="65" x2="61" y2="65" stroke="#55198b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="65" r="3" fill="#55198b"/>
  <line x1="114" y1="65" x2="123" y2="65" stroke="#55198b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="124" cy="65" r="3" fill="#55198b"/>

  <line x1="77" y1="50" x2="70" y2="43" stroke="#55198b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="69" cy="42" r="3" fill="#55198b"/>
  <line x1="107" y1="80" x2="114" y2="87" stroke="#55198b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="115" cy="88" r="3" fill="#55198b"/>
  <line x1="77" y1="80" x2="70" y2="87" stroke="#55198b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="69" cy="88" r="3" fill="#55198b"/>
  <line x1="107" y1="50" x2="114" y2="43" stroke="#55198b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="115" cy="42" r="3" fill="#55198b"/>

  <!-- Code vector scan magnifying glass -->
  <circle cx="120" cy="85" r="18" fill="#ffffff" fill-opacity="0.8" stroke="#55198b" stroke-width="3"/>
  <line x1="133" y1="98" x2="148" y2="113" stroke="#55198b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Alert crosshair inside magnifier -->
  <circle cx="120" cy="85" r="8" fill="none" stroke="#ef4444" stroke-width="2"/>
  <line x1="120" y1="73" x2="120" y2="97" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="108" y1="85" x2="132" y2="85" stroke="#ef4444" stroke-width="1.5"/>
</svg>
