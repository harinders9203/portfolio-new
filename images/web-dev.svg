<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="100%" height="100%">
  <defs>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
  </defs>

  <!-- Browser Window -->
  <rect x="25" y="20" width="150" height="100" rx="8" fill="url(#windowBg)" stroke="#55198b" stroke-width="2"/>
  
  <!-- Header tab bar -->
  <rect x="25" y="20" width="150" height="22" rx="8" fill="#55198b"/>
  <circle cx="38" cy="31" r="3" fill="#ef4444"/>
  <circle cx="48" cy="31" r="3" fill="#f59e0b"/>
  <circle cx="58" cy="31" r="3" fill="#10b981"/>
  
  <rect x="75" y="25" width="85" height="12" rx="4" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Code tags left -->
  <text x="36" y="65" fill="#7c3aed" font-size="20" font-family="monospace" font-weight="bold">&lt;/&gt;</text>
  <rect x="36" y="74" width="40" height="4" rx="2" fill="#a78bfa"/>
  <rect x="36" y="83" width="28" height="4" rx="2" fill="#c4b5fd"/>
  <rect x="36" y="92" width="45" height="4" rx="2" fill="#a78bfa"/>

  <!-- Responsive devices preview right -->
  <!-- Laptop frame -->
  <rect x="95" y="52" width="70" height="42" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="100" y="56" width="60" height="8" rx="2" fill="#55198b"/>
  <rect x="100" y="67" width="28" height="12" rx="2" fill="#ddd6fe"/>
  <rect x="132" y="67" width="28" height="12" rx="2" fill="#ede9fe"/>
  <polygon points="90,94 170,94 166,98 94,98" fill="#55198b"/>

  <!-- Mobile phone frame -->
  <rect x="145" y="75" width="20" height="35" rx="3" fill="#ffffff" stroke="#55198b" stroke-width="1.5"/>
  <circle cx="155" cy="106" r="1.5" fill="#55198b"/>
  <rect x="148" y="79" width="14" height="23" fill="#ede9fe"/>
</svg>
